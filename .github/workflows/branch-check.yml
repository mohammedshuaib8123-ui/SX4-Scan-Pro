name: Branch check

# Compiles and tests every push to a claude/* branch so Compose errors show up before merging to main.
# The build output is saved to the `ci-log` branch so it can be read without opening the Actions page.
on:
  push:
    branches: [ "claude/**" ]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests and debug build
        id: build
        run: |
          set -o pipefail
          { gradle testDebugUnitTest assembleDebug --console=plain 2>&1 | tee build.log; } || echo "FAILED" > build.failed
          test ! -f build.failed
      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SX4-Scan-Pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish log to ci-log branch
        if: always()
        run: |
          mkdir -p /tmp/cilog && cp build.log /tmp/cilog/build.log
          { echo "commit: ${GITHUB_SHA}"; echo "branch: ${GITHUB_REF_NAME}"; echo "result: ${{ steps.build.outcome }}"; } > /tmp/cilog/summary.txt
          grep -E "^e: |^w: .*(Sx|Drive|Welcome|Dtc|Freeze|Maint|Health)|FAILED|BUILD (SUCCESSFUL|FAILED)|tests completed" build.log > /tmp/cilog/errors.txt || true
          cd /tmp/cilog && git init -q && git checkout -q -b ci-log
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -q -m "build log for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log
