name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SX4-Scan-Pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Capture screenshots from the built app
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          script: |
            set -euo pipefail
            for attempt in $(seq 1 120); do
              booted="$(adb shell getprop sys.boot_completed | tr -d '\r')"
              if [ "$booted" = "1" ]; then break; fi
              sleep 2
            done
            test "${booted:-}" = "1"
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1280x768
            adb shell wm density 160
            adb shell am force-stop com.sx4scanpro
            adb shell am start -n com.sx4scanpro/.MainActivity
            sleep 30
            mkdir -p ui-screenshots
            capture_page() {
              name="$1"
              expected="$2"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml "ui-screenshots/$name.xml" >/dev/null
              if grep -qi "Process system isn't responding" "ui-screenshots/$name.xml"; then
                echo "System ANR dialog detected while capturing $name"
                exit 1
              fi
              if ! grep -qi "$expected" "ui-screenshots/$name.xml"; then
                echo "Expected page text '$expected' not found while capturing $name"
                exit 1
              fi
              adb shell screencap -p "/sdcard/$name.png"
              adb pull "/sdcard/$name.png" "ui-screenshots/$name.png" >/dev/null
            }
            capture_page "01-cockpit" "ENGINE TELEMETRY"
            adb shell input tap 480 680
            sleep 3
            capture_page "02-diagnostics" "ENGINE ECU"
            adb shell input tap 800 680
            sleep 3
            capture_page "03-head-unit" "ANDROID AUTO"
            adb shell input tap 1120 680
            sleep 3
            capture_page "04-settings" "WELCOME & ALERTS"
            rm -f ui-screenshots/*.xml
            cat > ui-screenshots/README.txt <<EOF
            SX4 Scan Pro — Build 19 UI screenshots
            Source commit: ${GITHUB_SHA}
            Captures: installed debug APK running in Android API 30 emulator
            Display: 1280x768 landscape, density 160 dpi
            Files: 01-cockpit.png, 02-diagnostics.png, 03-head-unit.png, 04-settings.png
            These are genuine runtime screenshots, not concept images.
            Emulator screenshots do not replace Realme Pad 2 or real SX4 testing.
            EOF
            cat > ui-screenshots/index.html <<'EOF'
            <!doctype html><html><head><meta charset="utf-8"><title>SX4 Scan Pro — Build 19 UI</title>
            <style>body{background:#080d14;color:#eef7ff;font:16px system-ui;margin:24px}main{max-width:1100px;margin:auto}section{margin:28px 0}img{width:100%;height:auto;border:1px solid #294054;border-radius:14px}h1{color:#38ddf5}p{color:#9db2c5}</style></head><body><main>
            <h1>SX4 Scan Pro — Build 19</h1><p>Runtime screenshots captured from the built debug APK.</p>
            <section><h2>01 · Cockpit</h2><img src="01-cockpit.png"></section>
            <section><h2>02 · Diagnostics</h2><img src="02-diagnostics.png"></section>
            <section><h2>03 · Head Unit</h2><img src="03-head-unit.png"></section>
            <section><h2>04 · Settings</h2><img src="04-settings.png"></section>
            </main></body></html>
            EOF
      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SX4-Scan-Pro-UI-Screenshots
          path: ui-screenshots/
          if-no-files-found: error
          retention-days: 14
