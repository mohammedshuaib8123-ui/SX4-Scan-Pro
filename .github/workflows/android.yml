name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SX4-Scan-Pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Capture screenshots from the built app
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 2000x1200
            adb shell wm density 220
            adb shell am start -n com.sx4scanpro/.MainActivity
            sleep 6
            mkdir -p ui-screenshots
            adb shell screencap -p /sdcard/cockpit.png
            adb pull /sdcard/cockpit.png ui-screenshots/01-cockpit.png
            adb shell input tap 750 1145
            sleep 2
            adb shell screencap -p /sdcard/diagnostics.png
            adb pull /sdcard/diagnostics.png ui-screenshots/02-diagnostics.png
            adb shell input tap 1250 1145
            sleep 2
            adb shell screencap -p /sdcard/head-unit.png
            adb pull /sdcard/head-unit.png ui-screenshots/03-head-unit.png
            adb shell input tap 1750 1145
            sleep 2
            adb shell screencap -p /sdcard/settings.png
            adb pull /sdcard/settings.png ui-screenshots/04-settings.png
      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SX4-Scan-Pro-UI-Screenshots
          path: ui-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
